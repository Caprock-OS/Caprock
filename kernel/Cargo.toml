# The Caprock kernel image.
#
# Phase 0: bootable skeleton. By design the kernel image will only ever contain
# the microkernel, capability system, scheduler, IPC and the Microkit runtime —
# drivers and services live in userland (see docs/adr/0006-hot-reload-architecture.md).

[package]
name = "caprock-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "caprock-kernel"
path = "src/main.rs"

[features]
# Optionale In-Kernel-Fuzzer (Entwicklungs-/Verifikationswerkzeuge, ADR 0013). NICHT in `default`:
# der Release-Build enthaelt keinerlei Fuzzer-Code. Mit `--features kernel-fuzz` werden die vier
# Fuzzer (fuzz/ipcfuzz/hwfuzz/loaderfuzz) aus `threads/fuzz.rs` einkompiliert. Die Audits bleiben
# IMMER im Kernel (feature-unabhaengig).
# `selftest` — die gesamte Pruefinfrastruktur (Selbsttests, Demo-/Testthreads, DMA-/DMAR-Tests,
# Farbtest, `system::testsupport`). Rund ein Viertel des Kernels ist Testcode, und er wurde bis
# hierher bei JEDEM Start mitkompiliert und ausgefuehrt.
#
# **NICHT in `default`** (A-2.2, gedreht 2026-07-29). Bis A-2.1 stand, waere das Gating kein
# schlankerer Kernel gewesen, sondern ein leerer: ohne Testcode blieb `configure() -> idle`, der
# Kernel hatte keinen Nicht-Test-Zweck. Jetzt hat er einen. `loader::start_root_task_reported()`
# liegt in `kernel_main` AUSSERHALB jedes Features: der Vorgabebau laedt das Startprogramm aus dem
# signierten Manifest und uebergibt ihm die Wurzel-Caps -- der seL4-Weg (todo F2). Ab hier ist jede
# weitere Faehigkeit ein Userland-Programm statt eines Kernel-Patches.
#
# Was der Vorgabebau NICHT mehr tut: Selbsttests, Demo-/Testthreads, DMA-/DMAR-Tests, Farbtest,
# `system::testsupport`. Rund ein Viertel des Kernels war Testcode und wurde bis hierher bei JEDEM
# Start mitkompiliert und ausgefuehrt.
#
# Bauen MIT Pruefinfrastruktur: `--features selftest`. Beide Suiten fordern das jetzt ausdruecklich
# fuer den gebooteten Bau (nicht ueber `default`) -- sonst waeren sie beim Dreh still geworden statt
# rot, und Stille sieht wie Erfolg aus.
# **Beide Konfigurationen gehoeren in die Testskripte.** Eine Konfiguration, die niemand baut,
# verrottet still -- diese Fehlerform hat hier schon viermal zugeschlagen (leere Event-Queue, nie
# ausgefuehrter x86-Testpfad, DMAR-Ausschlusspfad, und `--no-default-features` auf aarch64).
default = []
# Zieht die Pruefinfrastruktur der HAL mit: der IRTE-Vergabe-Selbsttest (Z22 P1) muss in dem
# Augenblick laufen, in dem Interrupt Remapping aufgesetzt wird -- den gibt es nur in `vtd::init`.
#
# C9: zieht ausserdem die **Sperrhaltedauer-Marke** mit. Sie sitzt in `caprock-sync`, also in
# JEDEM `lock()`, und kostet **gemessen 39,3 -> 162,3 Zyklen je unbestrittener Sperrhaltung**
# (+123 Zyklen, Faktor 4,1; A/B ueber zwei Bauten, 20 000 Runden je Seite). Das ist der Preis
# einer Messung, nicht der eines Mechanismus -- er gehoert in den Pruefbau und nicht in den
# Produktivkernel. Dieselbe Einordnung wie `kstackmark`.
# Fehlt sie, meldet die `sperre`-Zeile „NICHT GEMESSEN" und faellt durch, statt „alles kurz" zu
# behaupten.
selftest = ["caprock-hal/selftest", "caprock-sync/sperrwacht", "debug-log"]
kernel-fuzz = []
# `debug-log` — erzaehlende B-Print-Ausgabe (Bring-up-Details, Mess-Details, Diagnosezeilen),
# gegattert von den Straengen G1/G2 (loader/system/bringup/arch/main) und GATE-FEAT (Rest).
# Urteile (ALL PASS/FAILURES/SKIP), Suite-Gates, Panic-Pfade und fail-closed-Absagen gattern NIE.
# In `selftest` enthalten: die Suiten fahren mit Pruefinfrastruktur UND Erzaehlung, der
# schlanke Bau (F1, --no-default-features) schweigt. Allein stellbar fuer `.text`-Messung.
debug-log = []
# Continuous-Soak-Treiber (Burn-in #2): nach dem Selbsttest faehrt der Idle-Manager statt
# `system_off` eine Endlos-Epochenschleife (Dauerbetrieb EINER Instanz). NUR Harness/Testcode; der
# Kernel-Kern bleibt byte-identisch zum Release. Mit `soak,kernel-fuzz` kombinierbar.
soak = []
# **Die #DF-Sonde** (2026-08-10, x86): loest beim Hochlauf einen ECHTEN Double Fault aus, indem sie
# den Stackzeiger auf eine nicht abgebildete Adresse setzt und pusht. Der Kernel HAELT danach an --
# das ist der Sinn, ein #DF ist ein Abort.
#
# **Bewusst NICHT in `selftest`**: der regulaere Lauf soll gruen enden, und ein Kernel, der sich
# absichtlich zerlegt, tut das nicht. Ohne den Nachweis waere die IST-Arbeit aber eine Behauptung --
# ein IST-Eintrag, der nie benutzt wurde, ist von einem falsch aufgesetzten nicht zu unterscheiden.
# Gefahren wird sie von `tools/df-sonde.sh` in einem eigenen QEMU-Aufruf; dieselbe Datei faehrt die
# Gegenprobe `dfprobe,dfprobe-kein-ist`.
dfprobe = []
# Die STAERKERE Sonde: der Ueberlauf laeuft ueber die echte Guard-Page eines EL1-Stacks statt
# ueber eine beliebige unabgebildete Adresse. Damit wird der Zweig von `cr2_deutung` betreten,
# der die Wache NACHRECHNET -- ohne diesen Lauf waere er eine Behauptung. Setzt `dfprobe` voraus.
dfprobe-wache = ["dfprobe"]
# **Die Gegenprobe zur #DF-Sonde**: nimmt dem #DF-Gate seinen IST-Eintrag. Damit MUSS derselbe Lauf
# in einen Triple Fault ohne jede Ausgabe laufen -- und genau das belegt, dass die Meldung im
# Positivfall am IST-Stack haengt und nicht daran, dass ein #DF ohnehin irgendwie spricht.
dfprobe-kein-ist = ["caprock-hal/kein-df-ist"]
# **Die Gegenprobe zur Sperrhaltedauer-Marke** (C9). Baut in `sperrmark::probe` die C8-Falle
# woertlich wieder ein: `while let Some(x) = PROBE.lock().entnehmen() { arbeit(x) }`. Beide Zweige
# tun exakt dasselbe -- dieselbe Schlange, dieselbe Sperre, dieselbe Arbeit, dieselbe Anzahl
# Durchlaeufe; der EINZIGE Unterschied ist die Lebensdauer des Guards. Damit isoliert die
# Gegenprobe genau eine Eigenschaft.
#
# Erwartung: `sperre : FAILURES` mit einem Hoechststand von rund 1,5 Ticks und der Zeile des
# `while let` als Ort. Setzt `selftest` voraus.
sperrmark-gegenprobe = []
# **Die Gegenprobe zur EL0-Wasserstandsmarke** (C7b). Die Tiefensonde meldet sich fertig, ohne
# ihren Stack berührt zu haben — sonst bleibt ALLES gleich (derselbe Thread, dieselbe PD, dieselbe
# Meldung, dieselbe Messung). Damit fällt genau EIN Konjunkt der `ustack`-Zeile: `getroffen`.
#
# Sie isoliert damit die eine Aussage, die die Eichung strukturell nicht prüfen kann — dass die
# Marke die Tiefe eines ECHTEN EL0-Stacks findet und nicht bloss eine genullte Region anschaut.
# Eine Mutation, die zwei Dinge zugleich kaputtmacht, misst die Reihenfolge der Prüfungen und
# nicht die Eigenschaft (D9, erste Fassung).
#
# Erwartung: `ustack : FAILURES` mit `gemessen=true getroffen=false`, gemeldete Tiefe nahe 0, und
# der Lauf endet im Watchdog mit `offen waren: ustack`. Setzt `selftest` voraus.
ustack-gegenprobe = []

# Der Kernel-Kern + die aarch64-HAL: derzeit aarch64-spezifisch. Auf dem x86_64-Branch (Stufe 0:
# nur Boot+Serial) werden sie NICHT kompiliert; Stufe fuer Stufe werden die arch-agnostischen Crates
# ext-31: Alle Subsystem-Crates bauen jetzt fuer BEIDE Architekturen (die HAL waehlt ihre
# Implementierung per cfg(target_arch), s. caprock-hal). Die frueher aarch64-only Sektion
# entfaellt damit.
[dependencies]
caprock-hal = { path = "../crates/caprock-hal" }
caprock-sync = { path = "../crates/caprock-sync" }
caprock-slab = { path = "../crates/caprock-slab" }
caprock-mem = { path = "../crates/caprock-mem" }
# Z26: die BENANNTE Absage grosser, zusammenhaengender DMA (`gross`) und der DMA-Pool einer
# Treiber-PD. Abhaengigkeitsfrei und `forbid(unsafe_code)`; der Kernel benutzt daraus nur die
# Klassifikation -- sie liegt dort, weil sie sich mit Literalen host-pruefen laesst.
caprock-dma = { path = "../crates/caprock-dma" }
caprock-region = { path = "../crates/caprock-region" }
caprock-loader = { path = "../crates/caprock-loader" }
caprock-trust = { path = "../crates/caprock-trust" }
caprock-cap = { path = "../crates/caprock-cap" }
caprock-sched = { path = "../crates/caprock-sched" }
caprock-ipc = { path = "../crates/caprock-ipc" }
caprock-abi = { path = "../crates/caprock-abi" }
caprock-microkit = { path = "../crates/caprock-microkit" }

# Device-Tree gibt es nur auf der ARM-Plattform (x86 nutzt Multiboot/ACPI).
[target.'cfg(target_arch = "aarch64")'.dependencies]
caprock-dtb = { path = "../crates/caprock-dtb" }
caprock-handover = { path = "../crates/caprock-handover" }
