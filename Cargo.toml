# Caprock — capability-based Rust microkernel.
#
# Workspace root. Phase 0 contains only the bootable `kernel` image crate.
# Subsystem crates (capabilities, IPC, scheduler, memory) are split out in
# their respective phases — see docs/00-overview.md for the planned layout.

[workspace]
resolver = "2"
members = [
    "kernel",
    "crates/caprock-sync",
    "crates/caprock-slab",
    "crates/caprock-abi",
    "crates/caprock-hal",
    "crates/caprock-virtio",
    "crates/caprock-part",
    "crates/caprock-fat",
    "crates/caprock-mem",
    "crates/caprock-region",
    "crates/caprock-loader",
    "crates/caprock-trust",
    "crates/caprock-cap",
    "crates/caprock-sched",
    "crates/caprock-ipc",
    "crates/caprock-microkit",
    "crates/caprock-acpi",
    "crates/caprock-dtb",
    "crates/caprock-dma",
    "crates/caprock-wait",
    "crates/caprock-log",
    "crates/caprock-lxpd",
]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Caprock"]
version = "0.0.1"

# Bare-metal kernel: no unwinding, abort on panic.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
# Keep symbols for debugging boot issues; strip later if image size matters.
debug = true
lto = "thin"
